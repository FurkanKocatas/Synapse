# The scripts in tools/ are small command line programs; they report on stdout and stderr.
extend = "../backend/pyproject.toml"

[lint]
extend-ignore = ["T201"]
# The OCR benchmark's engine scripts run inside their own container (eval/ocr/Dockerfile): they
# call the engine binaries, import the heavy engines lazily per worker process, and use the
# container's own /tmp.
[lint.per-file-ignores]
"ocr/run.py" = ["PLW0603", "PLC0415", "S603", "S108"]
"ocr/hybrid.py" = ["PLW0603", "PLC0415", "S603"]
# Seeded randomness picks benchmark pages, simulates scans, samples chunks to time and picks the
# language model's training text; nothing secret depends on it.
"ocr/prepare.py" = ["S311"]
"ocr/char_lm.py" = ["S311"]
"retrieval/embed.py" = ["S311"]
# The answer benchmark and the llama.cpp encoders talk to a llama.cpp server on this machine; the
# answer benchmark samples questions with a seed.
"answers/answer.py" = ["S310", "S311"]
"retrieval/llama_encoder.py" = ["S310"]
