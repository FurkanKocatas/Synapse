# The embedding environment of the retrieval benchmark (README.md). Separate from the
# backend's: the candidates run under PyTorch, or ONNX Runtime as the product would run them.
[project]
name = "synapse-eval-retrieval"
version = "0"
requires-python = "==3.13.*"
dependencies = [
  "onnx>=1.19",
  "onnxruntime==1.24.4",
  "sentence-transformers>=5",
  "torch==2.14.0",
  "transformers==5.17.0",
]

[tool.uv]
package = false

# CPU-only PyTorch: the default wheels bring several GB of CUDA libraries.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
