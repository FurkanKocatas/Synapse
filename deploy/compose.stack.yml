# The whole product on one machine, built from this repository: a production-like stack for
# local end-to-end tests. Customer installs use files rendered by synapsectl (ADR 0012), with
# the same services and the same hardening.
#
#   python3 tools/dev_secrets.py
#   docker compose -f deploy/compose.stack.yml up -d --build --wait
#   docker compose -f deploy/compose.stack.yml run --rm api tenant create --slug demo --name Demo
#   echo "SYNAPSE_TENANT_ID=<printed id>" > .dev/stack.env && docker compose -f deploy/compose.stack.yml up -d
#
# Then open http://localhost:8480 (or the port in SYNAPSE_STACK_PORT).
name: synapse-stack

x-app: &app
  image: synapse-app:dev
  build:
    context: ..
    dockerfile: deploy/app/Dockerfile
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  networks: [internal]
  env_file:
    # Holds SYNAPSE_TENANT_ID once the tenant exists; see the commands at the top.
    - path: ../.dev/${SYNAPSE_STACK_ENV:-stack.env}
      required: false

x-db-env: &db-env
  SYNAPSE_DB_HOST: db
  SYNAPSE_DB_PORT: "5432"
  SYNAPSE_DB_NAME: synapse

# The model servers (ADR 0018), in the "models" profile: they need the model files in
# SYNAPSE_MODELS_DIR (default .dev/models; synapsectl models fetch). On the CPU here; for a GPU
# through Vulkan add -f deploy/compose.vulkan.yml. The same images and arguments as installations
# (synapsectl/render.py); the API and the worker call them when SYNAPSE_STACK_MODELS=1:
#   SYNAPSE_STACK_MODELS=1 docker compose -f deploy/compose.stack.yml --profile models up -d
x-model-server: &model-server
  image: ghcr.io/ggml-org/llama.cpp:server-b11243@sha256:f9115c95639e60abc09d4ea83b26fd4d56c66aa1174594393335a514da00c283
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  user: "10001:10001"
  networks: [internal]
  profiles: [models]
  volumes: ["${SYNAPSE_MODELS_DIR:-../.dev/models}:/models:ro"]
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
    interval: 10s
    timeout: 5s
    retries: 30
    start_period: 60s

x-embed-env: &embed-env
  SYNAPSE_EMBED_URL: ${SYNAPSE_STACK_MODELS:+http://llm-embed:8080}
  SYNAPSE_EMBED_KEY_FILE: /run/secrets/embed_key

services:
  db:
    build: ./postgres
    image: synapse-postgres:dev
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_superuser
    secrets: [postgres_superuser]
    volumes: [db-data:/var/lib/postgresql]
    networks: [internal]
    mem_limit: 2560m
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  bootstrap:
    <<: *app
    command:
      - db
      - bootstrap
      - --admin-conninfo-file=/run/secrets/admin_conninfo_stack
      - --secrets-dir=/run/secrets
    environment:
      <<: *db-env
    secrets:
      - admin_conninfo_stack
      - db_synapse_migrator
      - db_synapse_api
      - db_synapse_worker
      - db_synapse_scheduler
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  migrate:
    <<: *app
    command: [db, migrate]
    environment:
      <<: *db-env
      SYNAPSE_DB_USER: synapse_migrator
      SYNAPSE_DB_PASSWORD_FILE: /run/secrets/db_synapse_migrator
    secrets: [db_synapse_migrator]
    depends_on:
      bootstrap: { condition: service_completed_successfully }
    restart: "no"

  api:
    <<: *app
    command: [api]
    environment:
      <<: [*db-env, *embed-env]
      SYNAPSE_RERANK_URL: ${SYNAPSE_STACK_MODELS:+http://llm-rerank:8080}
      SYNAPSE_RERANK_KEY_FILE: /run/secrets/rerank_key
      SYNAPSE_CHAT_URL: ${SYNAPSE_STACK_MODELS:+http://llm-chat:8080}
      SYNAPSE_CHAT_KEY_FILE: /run/secrets/chat_key
      SYNAPSE_API_HOST: 0.0.0.0
      SYNAPSE_API_PORT: "8000"
      SYNAPSE_DB_USER: synapse_api
      SYNAPSE_DB_PASSWORD_FILE: /run/secrets/db_synapse_api
      SYNAPSE_CSRF_KEY_FILE: /run/secrets/csrf_key
      SYNAPSE_TOTP_KEY_FILE: /run/secrets/totp_key
      SYNAPSE_AUDIT_SIGNING_KEY_FILE: /run/secrets/audit_signing_key
      # Only the web front on the internal network may set X-Forwarded-For.
      SYNAPSE_TRUSTED_PROXY_IPS: ${SYNAPSE_STACK_SUBNET:-172.29.0.0/24}
      SYNAPSE_PUBLIC_URL: http://localhost:${SYNAPSE_STACK_PORT:-8480}
    secrets:
      [db_synapse_api, csrf_key, totp_key, audit_signing_key, embed_key, rerank_key, chat_key]
    volumes: [blobs:/var/lib/synapse/blobs]
    depends_on:
      migrate: { condition: service_completed_successfully }
    mem_limit: 768m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6

  worker:
    <<: *app
    command: [worker, --concurrency, "2"]
    environment:
      <<: [*db-env, *embed-env]
      SYNAPSE_DB_USER: synapse_worker
      SYNAPSE_DB_PASSWORD_FILE: /run/secrets/db_synapse_worker
    secrets: [db_synapse_worker, embed_key]
    # Workers read uploaded files, never write them.
    volumes: [blobs:/var/lib/synapse/blobs:ro]
    depends_on:
      migrate: { condition: service_completed_successfully }
    # OCR peaked at 1.2 GB with two pages at a time (docs/benchmarks/ocr.md), beside the
    # worker's own memory; the 16 GB tier's limit.
    mem_limit: 2560m
    restart: unless-stopped

  scheduler:
    <<: *app
    command: [scheduler]
    environment:
      <<: *db-env
      SYNAPSE_DB_USER: synapse_scheduler
      SYNAPSE_DB_PASSWORD_FILE: /run/secrets/db_synapse_scheduler
      SYNAPSE_AUDIT_SIGNING_KEY_FILE: /run/secrets/audit_signing_key
    # It signs the audit checkpoints.
    secrets: [db_synapse_scheduler, audit_signing_key]
    # It removes the files of purged documents.
    volumes: [blobs:/var/lib/synapse/blobs]
    depends_on:
      migrate: { condition: service_completed_successfully }
    mem_limit: 384m
    restart: unless-stopped

  web:
    image: synapse-web:dev
    build:
      context: ..
      dockerfile: deploy/web/Dockerfile
    read_only: true
    # Caddy's state directories, writable by its unprivileged user.
    tmpfs: ["/data:uid=10001,gid=10001", "/config:uid=10001,gid=10001"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # The internal network has no way out; the edge network carries the published port.
    networks: [internal, edge]
    ports:
      # Loopback only; the host port is configurable because 8080 is often taken.
      - "127.0.0.1:${SYNAPSE_STACK_PORT:-8480}:8080"
    depends_on:
      api: { condition: service_healthy }
    mem_limit: 128m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8099/"]
      interval: 10s
      timeout: 5s
      retries: 6

  llm-embed:
    <<: *model-server
    command:
      [-m, /models/bge-m3-f16.gguf, --no-webui, --embedding, --pooling, cls, -c, "8192", -np,
       "16", -b, "512", -ub, "512", --api-key-file, /run/secrets/embed_key]
    secrets: [embed_key]
    mem_limit: 1536m

  llm-rerank:
    <<: *model-server
    command:
      [-m, /models/bge-reranker-v2-m3-f16.gguf, --no-webui, --reranking, -c, "8192", -np, "16",
       -b, "512", -ub, "512", --api-key-file, /run/secrets/rerank_key]
    secrets: [rerank_key]
    mem_limit: 1536m

  llm-chat:
    <<: *model-server
    command:
      [-m, /models/Qwen3.5-4B-Q4_K_M.gguf, --no-webui, -c, "16384", --parallel, "2", --jinja,
       --reasoning-budget, "0", --cache-ram, "0", --api-key-file, /run/secrets/chat_key]
    secrets: [chat_key]
    mem_limit: 5g

networks:
  # No connections out of the machine from the services, as in installations.
  internal:
    internal: true
    ipam:
      config:
        - subnet: ${SYNAPSE_STACK_SUBNET:-172.29.0.0/24}
  edge: {}

secrets:
  postgres_superuser: { file: ../.dev/secrets/postgres_superuser }
  admin_conninfo_stack: { file: ../.dev/secrets/admin_conninfo_stack }
  db_synapse_migrator: { file: ../.dev/secrets/db_synapse_migrator }
  db_synapse_api: { file: ../.dev/secrets/db_synapse_api }
  db_synapse_worker: { file: ../.dev/secrets/db_synapse_worker }
  db_synapse_scheduler: { file: ../.dev/secrets/db_synapse_scheduler }
  csrf_key: { file: ../.dev/secrets/csrf_key }
  totp_key: { file: ../.dev/secrets/totp_key }
  audit_signing_key: { file: ../.dev/secrets/audit_signing_key }
  embed_key: { file: ../.dev/secrets/embed_key }
  rerank_key: { file: ../.dev/secrets/rerank_key }
  chat_key: { file: ../.dev/secrets/chat_key }

volumes:
  db-data:
  blobs:
