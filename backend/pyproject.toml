[project]
name = "synapse"
version = "0.1.0"
description = "On-premise AI knowledge assistant: document knowledge base with grounded, cited chat."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "Proprietary" }
dependencies = [
    "alembic>=1.20",
    "argon2-cffi>=25.1",
    "cryptography>=50.0",
    "defusedxml>=0.7.1",
    "fastapi>=0.141",
    # The model adapters' HTTP client (synapse/models/llama.py); the test client uses it too.
    "httpx2>=2.13",
    "onnxruntime>=1.24.4,<1.25",
    "opencv-python-headless>=5.0",
    "openpyxl>=3.1",
    "pillow>=12.0",
    "procrastinate>=3.10,<3.11",
    "psycopg[binary,pool]>=3.3",
    "pydantic>=2.13",
    "pydantic-settings>=2.15",
    "pyotp>=2.10",
    "pypdfium2>=5.13",
    "python-docx>=1.2",
    "python-pptx>=1.0",
    "rapidocr>=3.9.2,<3.10",
    "structlog>=26.1",
    "uvicorn[standard]>=0.54",
    "webauthn>=3.0.1",
]

[project.scripts]
synapse = "synapse.cli:main"

[dependency-groups]
dev = [
    "hypothesis>=6.140",
    "import-linter>=2.15",
    "mypy>=2.3",
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "pytest-cov>=7.1",
    "rapidfuzz>=3.14",
    "ruff>=0.16",
    "types-defusedxml>=0.7.0.20260504",
    "types-openpyxl>=3.1.5.20260827",
]

[tool.uv]
# rapidocr asks for the desktop OpenCV build, which needs libGL; the headless build provides
# the same cv2 module and is listed above.
override-dependencies = ["opencv-python; sys_platform == 'never'"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/synapse"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
# A broad rule set from the start; exceptions are listed with a reason.
select = [
    "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RET", "PTH",
    "S", "BLE", "FBT", "T20", "ERA", "PL", "RUF", "ASYNC", "DTZ", "TRY",
]
ignore = [
    "TRY003",  # Long exception messages are fine; our errors carry context.
]
# The product reads Turkish: its letters and typographic punctuation are real text here, not
# look-alikes of ASCII characters.
allowed-confusables = ["ı", "İ", "’", "‘", "“", "”", "\u2013", "\u2014"]

[tool.ruff.lint.per-file-ignores]
"src/synapse/cli.py" = ["T201"]  # command output is the point of the CLI
"tests/**" = [
    "S101",    # pytest uses assert.
    "S105",    # Test passwords are test data, not secrets.
    "S106",
    "RUF001",  # Turkish test data contains letters such as ı and İ on purpose.
    "PLR2004", # Magic values are normal in assertions.
    "FBT001",  # pytest.mark.parametrize passes expected booleans positionally.
]

[tool.ruff.lint.pylint]
max-statements = 50
max-branches = 12
max-args = 6

[tool.mypy]
strict = true
python_version = "3.14"
mypy_path = "src"
plugins = ["pydantic.mypy"]

# pypdfium2 ships no type information; its use is confined to knowledge/parsing.py and ocr.py.
[[tool.mypy.overrides]]
module = ["pypdfium2", "pypdfium2.*"]
ignore_missing_imports = true

# Nor does rapidocr; its use is confined to knowledge/rapid.py.
[[tool.mypy.overrides]]
module = ["rapidocr", "rapidocr.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers --strict-config -ra"
# Warnings are errors, so deprecations are dealt with when they appear, not years later.
filterwarnings = ["error"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.coverage.run]
source = ["src/synapse"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true

# Module boundaries (ADR 0015). Higher layers may import lower ones, never the reverse.
# New packages are added to these contracts when they are created.
[tool.importlinter]
root_package = "synapse"

[[tool.importlinter.contracts]]
name = "Layered architecture"
type = "layers"
layers = [
    "synapse.cli",
    "synapse.accounts_cli | synapse.audit_cli | synapse.worker_cli",
    "synapse.api | synapse.migrations",
    "synapse.chat",
    "synapse.knowledge",
    "synapse.jobs",
    "synapse.identity | synapse.authz | synapse.dbadmin | synapse.models",
    "synapse.audit",
    "synapse.kernel",
]

# Packages talk to each other only through their public module (ADR 0015).
[[tool.importlinter.contracts]]
name = "Identity is used only through synapse.identity.public"
type = "forbidden"
source_modules = ["synapse.accounts_cli", "synapse.api", "synapse.cli"]
forbidden_modules = [
    "synapse.identity.accounts",
    "synapse.identity.passkeys",
    "synapse.identity.passwords",
    "synapse.identity.profile",
    "synapse.identity.recovery",
    "synapse.identity.repository",
    "synapse.identity.service",
    "synapse.identity.throttle",
    "synapse.identity.tokens",
    "synapse.identity.totp",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Authorization is used only through synapse.authz.public"
type = "forbidden"
source_modules = ["synapse.api", "synapse.cli", "synapse.identity"]
forbidden_modules = ["synapse.authz.checks"]
# synapse.authz.management is reached through synapse.authz.public.management.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Knowledge is used only through synapse.knowledge.public"
type = "forbidden"
source_modules = ["synapse.api", "synapse.chat", "synapse.cli", "synapse.worker_cli"]
forbidden_modules = [
    "synapse.knowledge.blobs",
    "synapse.knowledge.chunking",
    "synapse.knowledge.dedup",
    "synapse.knowledge.documents",
    "synapse.knowledge.entities",
    "synapse.knowledge.filetypes",
    "synapse.knowledge.headings",
    "synapse.knowledge.language",
    "synapse.knowledge.ocr",
    "synapse.knowledge.parsing",
    "synapse.knowledge.pipeline",
    "synapse.knowledge.processing",
    "synapse.knowledge.quality",
    "synapse.knowledge.rapid",
    "synapse.knowledge.search",
    "synapse.knowledge.structure",
    "synapse.knowledge.turkish",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Models are used only through synapse.models.public"
type = "forbidden"
source_modules = [
    "synapse.api",
    "synapse.chat",
    "synapse.cli",
    "synapse.knowledge",
    "synapse.worker_cli",
]
forbidden_modules = ["synapse.models.llama", "synapse.models.ports"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Chat is used only through synapse.chat.public"
type = "forbidden"
source_modules = ["synapse.api", "synapse.cli"]
forbidden_modules = [
    "synapse.chat.answering",
    "synapse.chat.conversations",
    "synapse.chat.numerals",
    "synapse.chat.verification",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Audit is used only through synapse.audit.public"
type = "forbidden"
source_modules = [
    "synapse.accounts_cli",
    "synapse.api",
    "synapse.audit_cli",
    "synapse.cli",
    "synapse.identity",
]
forbidden_modules = ["synapse.audit.anchor", "synapse.audit.canonical", "synapse.audit.chain"]
allow_indirect_imports = true
