# Required checks for every push and pull request (ADR 0015).
# Third-party actions are pinned by commit SHA; the tag is in the trailing comment.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.14"
          enable-cache: false
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check . ../tools ../eval
      - name: Format
        run: uv run ruff format --check . ../tools ../eval
      - name: Types
        run: uv run mypy src tests ../tools/check_file_size.py ../tools/check_licences.py ../eval/corpus/fetch.py
      - name: Module boundaries
        run: uv run lint-imports
      - name: Test database
        # The same image and setup as local development (deploy/compose.dev.yml), so database
        # tests run against the real PostgreSQL build, extensions included.
        run: |
          python3 ../tools/dev_secrets.py
          docker compose -f ../deploy/compose.dev.yml up -d --wait db
      - name: Tests
        run: uv run pytest --cov

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Types
        run: pnpm typecheck
      - name: Format
        run: pnpm format:check
      - name: Translations
        run: pnpm i18n:check
      - name: Tests
        run: pnpm test
      - name: Build
        run: pnpm build

  repository:
    name: Repository checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history, so the secret scan covers every commit, not only the last one.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.14"
          enable-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: File size limits
        run: python3 tools/check_file_size.py
      - name: Secret scan
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --redact --verbose
      - name: Workflow security
        run: uvx zizmor@1.30.1 --pedantic .github/workflows
      - name: Install dependencies for audits
        run: |
          (cd backend && uv sync --locked)
          pnpm --dir frontend install --frozen-lockfile
      - name: Licences
        run: |
          (cd backend && uv run --with pip-licenses pip-licenses --from=mixed --format=json) \
            > "$RUNNER_TEMP/python-licences.json"
          pnpm --dir frontend licenses list --json > "$RUNNER_TEMP/node-licences.json"
          python3 tools/check_licences.py \
            "$RUNNER_TEMP/python-licences.json" "$RUNNER_TEMP/node-licences.json"
      - name: Vulnerabilities
        run: |
          (cd backend && uv export --frozen --no-emit-project) > "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit@2.10.1 -r "$RUNNER_TEMP/requirements.txt" --disable-pip --require-hashes
          pnpm --dir frontend audit --audit-level high

  images:
    name: Images and end-to-end smoke test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Full stack smoke test (builds the images)
        run: tools/stack_smoke.sh
      - name: Image scan
        # Fails on any HIGH or CRITICAL vulnerability that already has a fix.
        run: |
          for image in synapse-app:dev synapse-web:dev synapse-postgres:dev; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
              image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed "$image"
          done
