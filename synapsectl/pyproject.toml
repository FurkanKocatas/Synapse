[project]
name = "synapsectl"
version = "0.1.0"
description = "Installer and operations tool for Synapse, run by the vendor's installer on the customer machine."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "Proprietary" }
dependencies = [
    "pydantic>=2.13",
    "pyyaml>=6.0",
    "tomli-w>=1.2",
]

[project.scripts]
synapsectl = "synapsectl.cli:main"

[dependency-groups]
dev = [
    "mypy>=2.3",
    "pytest>=9.1",
    "pytest-cov>=7.1",
    "ruff>=0.16",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/synapsectl"]

[tool.ruff]
extend = "../backend/pyproject.toml"

[tool.ruff.lint.per-file-ignores]
"src/synapsectl/cli.py" = ["T201"]     # command output is the point of the CLI
# The wizard talks to the installer on the terminal, and transliterates Turkish letters.
"src/synapsectl/wizard.py" = ["T201", "RUF001", "RUF002"]
"tests/**" = ["S101", "PLR2004", "S105", "S106", "RUF001"]  # RUF001: Turkish test data

[tool.mypy]
strict = true
python_version = "3.14"
mypy_path = "src"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config -ra"
filterwarnings = ["error"]
pythonpath = ["."]

[tool.coverage.run]
source = ["src/synapsectl"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
